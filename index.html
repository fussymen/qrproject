<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>卡票二维码</title>
<script src="qrcode.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, system-ui, sans-serif; background: #f5f5f5; color: #333; }
.hidden { display: none !important; }

#loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
.spinner { width: 40px; height: 40px; border: 3px solid #ddd; border-top-color: #4a90d9; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#loading p { margin-top: 16px; color: #999; font-size: 14px; }

#login { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; }
.login-card { background: #fff; border-radius: 12px; padding: 32px 24px; width: 100%; max-width: 360px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
.login-card h2 { text-align: center; font-size: 18px; font-weight: 500; margin-bottom: 24px; color: #333; }
.login-card input { width: 100%; height: 44px; border: 1px solid #ddd; border-radius: 8px; padding: 0 14px; font-size: 16px; margin-bottom: 12px; outline: none; transition: border-color 0.2s; }
.login-card input:focus { border-color: #4a90d9; }
.btn { width: 100%; height: 44px; border: none; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; transition: opacity 0.2s; }
.btn-primary { background: #4a90d9; color: #fff; }
.btn-secondary { background: #f0f0f0; color: #666; margin-top: 8px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn:active { opacity: 0.8; }
.login-tip { text-align: center; font-size: 12px; color: #999; margin-top: 16px; line-height: 1.6; }
.error-msg { color: #e74c3c; font-size: 13px; text-align: center; margin-top: 8px; min-height: 18px; }

#qrcode-view { display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
.qr-header { width: 100%; max-width: 360px; text-align: center; margin-bottom: 16px; }
.qr-header .title { font-size: 16px; font-weight: 500; color: #333; }
.qr-header .subtitle { font-size: 13px; color: #999; margin-top: 4px; }
.qr-card { background: #fff; border-radius: 12px; padding: 24px; width: 100%; max-width: 360px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); text-align: center; }
#qr-canvas { display: block; margin: 0 auto; }
.qr-info { margin-top: 16px; }
.qr-info .name { font-size: 16px; font-weight: 500; }
.qr-info .meta { font-size: 13px; color: #999; margin-top: 4px; }
.qr-status { margin-top: 12px; font-size: 12px; color: #4a90d9; }
.qr-status .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #4a90d9; margin-right: 4px; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

.passcode-list { width: 100%; max-width: 360px; margin-top: 16px; }
.passcode-list .label { font-size: 12px; color: #999; margin-bottom: 8px; }
.passcode-item { display: flex; align-items: center; justify-content: space-between; background: #fff; border-radius: 8px; padding: 12px 16px; margin-bottom: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); cursor: pointer; transition: transform 0.1s; }
.passcode-item:active { transform: scale(0.98); }
.passcode-item.active { border-left: 3px solid #4a90d9; }
.passcode-item .name { font-size: 14px; font-weight: 500; }
.passcode-item .meta { font-size: 12px; color: #999; }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p id="loading-text">正在加载...</p>
</div>

<div id="login" class="hidden">
  <div class="login-card">
    <h2>卡票二维码</h2>
    <div class="token-input-area">
      <div class="label" style="font-size:12px;color:#999;margin-bottom:8px;text-align:center;">Token 已失效，请重新填入</div>
      <input type="text" id="token-input" placeholder="x-token (JWT)" style="font-size:12px;">
      <input type="text" id="uid-input" placeholder="uid" style="font-size:12px; margin-top:8px;">
      <button class="btn btn-secondary" style="margin-top:8px;" onclick="manualToken()">保存并刷新</button>
      <div class="error-msg" id="token-error"></div>
    </div>
    <div class="login-tip">打开小程序卡票页，用内存抓取工具<br>重新提取 x-token 和 uid 后填入此处</div>
  </div>
</div>

<div id="qrcode-view" class="hidden">
  <div class="qr-header">
    <div class="title" id="qr-title">卡票二维码</div>
    <div class="subtitle" id="qr-subtitle"></div>
  </div>
  <div class="qr-card">
    <div id="qr-box"></div>
    <div class="qr-info">
      <div class="name" id="qr-name"></div>
      <div class="meta" id="qr-meta"></div>
    </div>
    <div class="qr-status">
      <span class="dot"></span>
      <span id="qr-refresh-text">二维码 5秒后刷新</span>
    </div>
  </div>
  <div class="passcode-list" id="passcode-list"></div>
</div>

<script>
var cards = [];
var currentCard = null;
var qrTimer = null;
var countdown = 5;
var ws = null;

document.addEventListener('DOMContentLoaded', init);

function init() {
  fetch('/api/status')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.loggedIn && data.passcodes) {
        var list = normalize(data.passcodes);
        if (list.length > 0) {
          showQRView(list);
          return;
        }
      }
      document.getElementById('loading').classList.add('hidden');
      showLogin();
    })
    .catch(function() {
      document.getElementById('loading-text').textContent = '连接服务失败';
    });
}

// 把 passcodes 对象（categories + 各分类数组）归一化为卡列表
function normalize(p) {
  var defs = [
    { key: 'vips',          type: 5  },
    { key: 'singleTickets', type: 16 },
    { key: 'countCards',    type: 1  },
    { key: 'depositCards',  type: 25 },
    { key: 'courts',        type: 0  },
    { key: 'longTerm',      type: 8  },
    { key: 'appointment',   type: 28 }
  ];
  var cats = p.categories || [];
  var out = [];
  defs.forEach(function(d) {
    var arr = p[d.key];
    if (!Array.isArray(arr)) return;
    arr.forEach(function(c) {
      var qrId = c.id;
      // 与小程序一致：会员卡用 buyLogId，次卡用 userSubCounterCardId
      if (d.type === 5 && c.buyLogId) qrId = c.buyLogId;
      else if (d.type === 26 && c.userSubCounterCardId) qrId = c.userSubCounterCardId;
      var cat = cats.filter(function(x) { return x.type === d.type; })[0];
      out.push({
        qrId: qrId,
        qrType: d.type,
        name: c.name || (cat ? cat.name : '卡票'),
        catName: cat ? cat.name : d.key,
        expireTime: c.expireTime || c.expiredAt || ''
      });
    });
  });
  return out;
}

function showQRView(list) {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('login').classList.add('hidden');
  document.getElementById('qrcode-view').classList.remove('hidden');
  cards = list;
  selectCard(cards[0]);
  renderList();
  connectWebSocket();
}

function renderList() {
  var c = document.getElementById('passcode-list');
  var html = '<div class="label">我的卡票 (' + cards.length + ')</div>';
  cards.forEach(function(card, i) {
    var active = currentCard && card.qrId === currentCard.qrId && card.qrType === currentCard.qrType;
    html += '<div class="passcode-item' + (active ? ' active' : '') + '" onclick="selectCard(cards[' + i + '])">' +
      '<div><div class="name">' + escapeHtml(card.name) + '</div>' +
      '<div class="meta">' + escapeHtml(card.catName) + (card.expireTime ? ' | ' + escapeHtml(card.expireTime) : '') + '</div></div></div>';
  });
  c.innerHTML = html;
}

function selectCard(card) {
  currentCard = card;
  document.getElementById('qr-title').textContent = card.name;
  document.getElementById('qr-meta').textContent = card.catName + (card.expireTime ? (' | 有效期至 ' + card.expireTime) : '');
  document.getElementById('qr-subtitle').textContent = '';
  countdown = 5;
  fetchQRCode();
  if (!qrTimer) {
    qrTimer = setInterval(function() {
      countdown--;
      document.getElementById('qr-refresh-text').textContent = '二维码 ' + countdown + '秒后刷新';
      if (countdown <= 0) { fetchQRCode(); countdown = 5; }
    }, 1000);
  }
  renderList();
}

function fetchQRCode() {
  if (!currentCard) return;
  document.getElementById('qr-refresh-text').textContent = '正在获取二维码...';
  fetch('/api/qrcode?id=' + encodeURIComponent(currentCard.qrId) + '&type=' + currentCard.qrType)
    .then(function(r) {
      return r.json().then(function(d) { return { status: r.status, data: d }; })
        .catch(function() { return { status: r.status, data: null }; });
    })
    .then(function(res) {
      var d = res.data;
      if (typeof d === 'string' && d.length > 0) {
        renderQR(d);
        document.getElementById('qr-refresh-text').textContent = '二维码 ' + countdown + '秒后刷新';
      } else if (d && d.message) {
        document.getElementById('qr-refresh-text').textContent = '获取失败: ' + d.message;
      } else if (res.status === 401 || res.status === 403) {
        clearInterval(qrTimer); qrTimer = null;
        showLogin();
      } else {
        document.getElementById('qr-refresh-text').textContent = '获取失败，稍后重试';
      }
    })
    .catch(function() {
      document.getElementById('qr-refresh-text').textContent = '网络错误，重试中';
    });
}

function renderQR(text) {
  var box = document.getElementById('qr-box');
  box.innerHTML = '';
  var size = Math.min(window.innerWidth - 88, 300);
  if (window.QRCode) {
    new QRCode(box, {
      text: text,
      width: size,
      height: size,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });
  } else {
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js';
    s.onload = function() { renderQR(text); };
    s.onerror = function() { fallbackText(box, size, text); };
    document.head.appendChild(s);
  }
}

function fallbackText(box, size, text) {
  box.innerHTML = '<div style="font-size:12px;word-break:break-all;padding:8px;color:#333;">' + escapeHtml(text) + '</div>';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// ==================== 手动 token 兜底 ====================
function showLogin() {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('qrcode-view').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
}

function manualToken() {
  var token = document.getElementById('token-input').value.trim();
  var uid = document.getElementById('uid-input').value.trim();
  var errEl = document.getElementById('token-error');
  errEl.textContent = '';
  if (!token || !uid) { errEl.textContent = 'Token 和 uid 都需要'; return; }
  fetch('/api/login/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: token, uid: uid })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.success) { location.reload(); }
    else { errEl.textContent = data.error || 'Token 无效'; }
  })
  .catch(function() { errEl.textContent = '网络错误'; });
}

// ==================== WebSocket 实时通知 ====================
function connectWebSocket() {
  if (ws) ws.close();
  try {
    var wsUrl = (location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host + '/ws';
    ws = new WebSocket(wsUrl);
    ws.onopen = function() { console.log('[WS] Connected'); };
    ws.onmessage = function(event) {
      try {
        var msg = JSON.parse(event.data);
        if (msg.type === 1 || msg.type === '1') { fetchQRCode(); countdown = 5; }
      } catch (e) {}
    };
    ws.onclose = function() { setTimeout(connectWebSocket, 3000); };
    ws.onerror = function() {};
  } catch (e) {}
}

document.addEventListener('visibilitychange', function() {
  if (!document.hidden && currentCard) { fetchQRCode(); countdown = 5; }
});
</script>
</body>
</html>
