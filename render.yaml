# Render 部署描述文件（Infra as Code）
# 用法：把 qrcode-app/ 推到 GitHub/GitLab 仓库后，
# 在 render.com 新建 Web Service 时选择该仓库，Render 会自动按此配置部署。
services:
  - type: web
    name: card-qrcode
    runtime: node
    plan: free
    region: oregon          # 免费套餐默认区域；国内访问略慢但可用
    branch: main
    buildCommand: "npm install"
    startCommand: "node server.js"
    healthCheckPath: /api/status
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
